# Local practice copy of the MavDine database (Oracle Database Free 23ai).
# Start:  docker compose up -d      (first start downloads ~1 GB and takes a minute or two)
# Stop:   docker compose down       (data is kept in the "mavdine-data" volume)
# Wipe:   docker compose down -v
# Login in the app: host localhost, port 1521, service FREEPDB1, user mavdine, password mavdine
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: mavdine-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: mavdine_admin
      APP_USER: mavdine
      APP_USER_PASSWORD: mavdine
    volumes:
      - mavdine-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  mavdine-data:
